
name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout GitHub repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Validate required secrets
      - name: Check required secrets
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USERNAME: ${{ secrets.AWS_USERNAME }}
          AWS_PRIVATE_KEY: ${{ secrets.AWS_PRIVATE_KEY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -e

          for name in AWS_HOST AWS_USERNAME AWS_PRIVATE_KEY DOCKER_USERNAME DOCKER_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "ERROR: $name is missing or empty"
              exit 1
            fi
          done

          echo "All required secrets are available."

      # Step 3: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4: Build and push frontend image
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/frontend:latest

      # Step 5: Build and push backend image
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/backend:latest

      # Step 6: Prepare application directory on EC2
      - name: Prepare EC2 directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 2m
          script: |
            mkdir -p /home/ubuntu/app/nginx
            echo "EC2 application directory is ready."

      # Step 7: Copy Docker Compose and Nginx configuration
      - name: Copy compose and nginx config to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          port: 22
          source: "docker-compose.prod.yml,nginx/default.conf"
          target: "/home/ubuntu/app"
          timeout: 60s
          command_timeout: 2m
          overwrite: true

      # Step 8: Deploy application on EC2
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 5m
          envs: DOCKER_USERNAME,DOCKER_PASSWORD
          script: |
            set -e

            cd /home/ubuntu/app

            echo "Logging in to Docker Hub..."
            echo "$DOCKER_PASSWORD" | docker login \
              --username "$DOCKER_USERNAME" \
              --password-stdin

            echo "Pulling latest Docker images..."
            docker compose -f docker-compose.prod.yml pull

            echo "Starting application containers..."
            docker compose -f docker-compose.prod.yml up -d

            echo "Checking container status..."
            docker compose -f docker-compose.prod.yml ps

            echo "Checking Nginx configuration..."
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -t

            echo "Restarting Nginx..."
            docker compose -f docker-compose.prod.yml restart nginx

            echo "Removing unused Docker images..."
            docker image prune -f

            echo "Deployment completed successfully."
