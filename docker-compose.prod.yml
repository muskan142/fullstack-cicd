services:
  frontend:
    image: ${DOCKER_USERNAME}/frontend:latest
    restart: always

  backend:
    image: ${DOCKER_USERNAME}/backend:latest
    restart: always
    environment:
      MONGO_URL: mongodb://mongodb:27017/studentdb
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7
    restart: always
    volumes:
      - mongo-data:/data/db

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend

volumes:
  mongo-data: